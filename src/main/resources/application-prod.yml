# Profil production : rien de sensible en dur, tout vient de l'environnement.
# Active avec SPRING_PROFILES_ACTIVE=prod.
spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

  docker:
    compose:
      # Pas de docker-compose en production : la base est fournie par la plateforme.
      enabled: false

  jpa:
    show-sql: false

  # SMTP de Gmail. Le mot de passe n'est PAS celui du compte Google mais un
  # « mot de passe d'application », a generer dans la securite du compte apres
  # activation de la validation en deux etapes. Il ne donne acces qu'a l'envoi
  # de courriel et se revoque independamment.
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          # Sans ces delais, un SMTP muet retient un fil d'execution
          # indefiniment. L'envoi etant asynchrone, seul le pool en souffre,
          # mais il finirait par etre epuise.
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  # Derriere le proxy de Coolify, `getRemoteAddr()` renvoie sinon l'adresse du
  # proxy : toutes les requetes du monde partageraient alors un seul quota de
  # connexion, et la limitation de debit ne protegerait plus rien.
  #
  # Sur ce reglage, l'application fait confiance a `X-Forwarded-For`. C'est
  # legitime ici parce que le proxy est le seul chemin d'entree : le conteneur
  # ne publie aucun port, personne ne peut le joindre en direct pour forger
  # l'en-tete.
  forward-headers-strategy: framework

pulsetrack:
  security:
    jwt:
      # Aucune valeur par defaut : le demarrage echoue si le secret est absent,
      # ce qui vaut mieux que de signer les jetons avec un secret connu de tous.
      secret: ${PULSETRACK_JWT_SECRET}
    cors:
      # Facultatif : seul un client navigateur est soumis au CORS, et
      # l'application mobile native ne l'est pas. Laissee vide, aucune regle
      # n'est posee — a renseigner le jour ou un front web appellera l'API.
      allowed-origins: ${PULSETRACK_CORS_ORIGINS:}
    encryption:
      password: ${PULSETRACK_ENCRYPTION_PASSWORD}
      salt: ${PULSETRACK_ENCRYPTION_SALT}

  mail:
    # A `false`, la reinitialisation reste acceptee mais le code part dans les
    # journaux : utile pour eprouver le parcours avant de brancher le SMTP.
    enabled: ${PULSETRACK_MAIL_ENABLED:false}
    # Avec Gmail, doit correspondre au compte authentifie : le serveur reecrit
    # ou rejette une adresse d'expedition qui ne lui appartient pas.
    from: ${PULSETRACK_MAIL_FROM:}

  gemini:
    api-key: ${PULSETRACK_GEMINI_API_KEY:}

  push:
    fcm:
      enabled: ${PULSETRACK_FCM_ENABLED:false}
      project-id: ${PULSETRACK_FCM_PROJECT_ID:}
      # Contenu du JSON de compte de service, encode en base64. C'est la forme
      # retenue en production : Coolify sait chiffrer et gerer une variable
      # d'environnement, mais ne sait pas alimenter le contenu d'un fichier
      # monte depuis un compose.
      credentials-base64: ${PULSETRACK_FCM_CREDENTIALS_BASE64:}
      # Voie alternative, pour un hebergeur capable de monter un vrai fichier.
      # Ignoree des que la variable ci-dessus est renseignee.
      credentials-location: ${PULSETRACK_FCM_CREDENTIALS:}

# Documentation interactive. Elle decrit toute la surface de l'API : qui la
# consulte sait exactement quels endpoints existent et quelles formes ils
# attendent. C'est commode pour developper, et c'est autant de renseignement
# offert a qui cherche une faille.
#
# Publiee ici a la demande, mais gardee sous interrupteur : passer
# PULSETRACK_DOCS_ENABLED a `false` la retire sans redeployer de code.
#
# Cela ne rend rien d'autre accessible : hors inscription, connexion et
# renouvellement, chaque endpoint exige toujours un jeton valide. La
# documentation dit ce qui existe, elle n'ouvre aucune porte.
springdoc:
  api-docs:
    enabled: ${PULSETRACK_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${PULSETRACK_DOCS_ENABLED:true}

logging:
  level:
    com.pulsetrack.backend: INFO
  structured:
    format:
      console: ecs
