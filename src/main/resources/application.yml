spring:
  application:
    name: pulsetrack-backend

  jpa:
    hibernate:
      # Le schema est gere par Flyway. `validate` fait echouer le demarrage si les
      # entites et les migrations divergent : c'est le filet de securite.
      ddl-auto: validate
    # Ferme la session JPA a la sortie du service : on ne veut pas de requete
    # declenchee pendant la serialisation JSON (lazy loading masque).
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          # Insertions groupees par cinquante. Sans cela, enregistrer le trace
          # d'une course longue coute un aller-retour par point : mesure a 12 s
          # pour trois heures de course en local, davantage sur un petit
          # serveur, au-dela du delai d'attente du client mobile.
          batch_size: 50
        # Indispensables au regroupement : Hibernate ecrit une seance et ses
        # milliers de points dans la meme transaction, et sans tri il alterne
        # les tables, ce qui interrompt chaque lot au bout d'une ligne.
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    default-property-inclusion: non_null

  mvc:
    problemdetails:
      enabled: true

server:
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

pulsetrack:
  security:
    jwt:
      # Secret de DEVELOPPEMENT uniquement. En production il DOIT venir de
      # l'environnement (PULSETRACK_JWT_SECRET) : voir application-prod.yml.
      # Le prefixe `dev-only-` est reconnu par DevelopmentSecretWarner, qui
      # alerte au demarrage tant qu'il est en place.
      secret: 'dev-only-secret-change-me-0123456789-abcdefghijklmnopqrstuvwxyz'
      issuer: 'pulsetrack'
      access-token-ttl: PT24H
    password-reset:
      # Trente minutes : le code voyage par courriel, un canal qu'on ne maitrise
      # pas et dont l'historique reste consultable longtemps.
      ttl: PT30M
    refresh-token:
      # Trente jours : c'est la duree pendant laquelle le client mobile peut
      # renouveler sa session sans redemander le mot de passe. Contrairement au
      # jeton d'acces, celui-ci est revocable a tout moment.
      ttl: P30D
    rate-limit:
      # Plafonds des endpoints ouverts. Comptes separement par adresse IP et,
      # pour la connexion, par compte vise.
      login:
        # Assez large pour un utilisateur qui se trompe, largement trop etroit
        # pour essayer un dictionnaire de mots de passe.
        max-attempts: 10
        window: PT5M
      register:
        # Personne ne cree cinq comptes par heure de bonne foi.
        max-attempts: 5
        window: PT1H
      password-reset:
        # Vaut pour la demande de code comme pour l'essai d'un code. Etroit a
        # dessein : c'est ce plafond qui empeche d'inonder une boite aux lettres
        # et qui met la recherche exhaustive du code hors de portee.
        max-attempts: 5
        window: PT15M
    cors:
      # Origines autorisees pour un client web (Flutter web en dev).
      # L'app mobile native n'est pas soumise au CORS.
      allowed-origins:
        - 'http://localhost:3000'
        - 'http://localhost:8080'
    encryption:
      # Secrets de DEVELOPPEMENT. Changer ce couple rend illisibles les cles
      # Gemini deja stockees : les utilisateurs devront les ressaisir.
      password: 'dev-only-encryption-password-change-me'
      salt: 'a1b2c3d4e5f60718'

  gemini:
    base-url: 'https://generativelanguage.googleapis.com'
    # Surchargeable par variable d'environnement, et pas seulement par fichier.
    # Le 11 aout 2026, `gemini-2.5-flash` a cesse d'etre servi aux nouvelles
    # cles — « no longer available to new users » — et l'assistant repondait 502
    # a chaque appel. Sans cette variable, remettre le service en marche
    # imposait de modifier le code, reconstruire l'image et redeployer, pour un
    # simple nom de modele.
    model: ${PULSETRACK_GEMINI_MODEL:gemini-3.5-flash}
    timeout: PT30S
    max-output-tokens: 900
    # Cle de niveau serveur, par variable d'environnement. C'est le mode
    # recommande pour un usage personnel : la cle ne quitte jamais
    # l'environnement du serveur et n'est jamais ecrite en base.
    # Laissee vide, l'assistant retombe sur la cle saisie par l'utilisateur.
    api-key: ${PULSETRACK_GEMINI_API_KEY:}

  push:
    fcm:
      # Desactive par defaut : sans projet Firebase, l'application doit demarrer
      # et fonctionner normalement, en journalisant les envois au lieu de les faire.
      enabled: false
      project-id: ''
      # Chemin du JSON de compte de service telecharge depuis la console
      # Firebase. En local, le fichier ignore par git convient :
      # file:./secrets/firebase-service-account.json
      credentials-location: ''
      # Meme contenu encode en base64, pour un hebergeur qui ne sait pas monter
      # de fichier. Prioritaire sur credentials-location.
      credentials-base64: ''

  mail:
    # Desactive en developpement : le code de reinitialisation part alors dans
    # les journaux au lieu d'un courriel, ce qui permet d'eprouver tout le
    # parcours sans serveur de messagerie.
    enabled: false
    from: ''

  access:
    # Compte promu administrateur, au demarrage s'il existe deja et a
    # l'inscription sinon. Vide, aucune promotion n'a lieu et l'espace
    # d'administration reste inaccessible a tout le monde.
    admin-email: ${PULSETRACK_ADMIN_EMAIL:}
    # Mot de passe d'amorçage. Renseigne, le compte administrateur est cree au
    # demarrage s'il n'existe pas encore : plus besoin de s'inscrire avant de
    # pouvoir ouvrir l'application d'administration.
    #
    # Il ne sert QU'A LA CREATION. Un compte deja present n'est jamais reecrit,
    # sinon chaque redeploiement effacerait un mot de passe change depuis
    # l'application.
    #
    # A RETIRER apres la premiere connexion : une valeur posee ici se lit en
    # clair dans le tableau de bord de la plateforme et survit dans l'historique
    # de configuration.
    admin-password: ${PULSETRACK_ADMIN_PASSWORD:}
    # Modules ouverts a toute nouvelle inscription : le socle qui rend
    # l'application mobile utilisable seule — enregistrer ses seances, se peser,
    # se fixer des objectifs et recevoir ses rappels.
    #
    # Le reste (STATS, WEEKLY_SUMMARY, COACH, EXPORT) se merite : l'administrateur
    # l'accorde compte par compte. COACH est le plus sensible des quatre, chaque
    # echange etant un appel facture a Gemini.
    default-modules:
      - 'WORKOUTS'
      - 'BODY_CHECKINS'
      - 'GOALS'
      - 'PUSH'
    # Compromis entre une requete par appel authentifie et le delai avant qu'un
    # retrait de droit prenne effet. Une minute : assez court pour qu'un
    # administrateur ne doute pas de son geste, assez long pour epargner la base
    # sur un serveur a deux processeurs.
    cache-ttl: PT60S

  reminders:
    enabled: true
    # Fuseau des rappels planifies. Mono-utilisateur : une seule valeur suffit.
    zone: 'Africa/Ouagadougou'
    # Dimanche 19h : rappel de la pesee hebdomadaire.
    weekly-checkin-cron: '0 0 19 * * SUN'
    # Dimanche 10h : alerte si les objectifs de la semaine sont loin d'etre atteints.
    effort-warning-cron: '0 0 10 * * SUN'

logging:
  level:
    com.pulsetrack.backend: DEBUG
