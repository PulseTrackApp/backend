services:
  postgres:
    image: 'postgres:17-alpine'
    container_name: pulsetrack-postgres
    environment:
      - 'POSTGRES_DB=pulsetrack'
      - 'POSTGRES_USER=pulsetrack'
      - 'POSTGRES_PASSWORD=pulsetrack'
    ports:
      # Port fixe : le module spring-boot-docker-compose configure la datasource
      # automatiquement, mais un port fixe permet aussi de se brancher avec psql.
      - '5432:5432'
    volumes:
      - 'pulsetrack-pgdata:/var/lib/postgresql/data'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pulsetrack -d pulsetrack']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pulsetrack-pgdata:
